<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>导航</title>
<style>
:root{--bg:#0b1116;--card:#16222b;--line:#2a3a45;--text:#e8eef2;--muted:#93a4b0;--accent:#2f8f5b;--warn:#f2b36b;--blue:#2d7ff9}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#mapwrap{position:fixed;inset:0;background:#0f1a21}
#map{width:100%;height:100%}   /* BMapGL sets the container's own position: the wrapper keeps it full screen */
body.nomap #mapwrap{display:none}
#top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;z-index:5}
#f{display:flex;gap:8px}
#q{flex:1;font-size:17px;padding:12px 14px;border-radius:12px;border:0;background:var(--card);color:var(--text);box-shadow:0 2px 10px #0008;outline:none}
#chips{display:flex;gap:8px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.chip svg{vertical-align:-3px;margin-right:4px}
.chip{flex:none;font-size:15px;padding:8px 14px;border-radius:18px;border:0;background:var(--card);color:var(--text);box-shadow:0 2px 8px #0008}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:55vh;overflow-y:auto;z-index:5;background:var(--bg);border-radius:16px 16px 0 0;
  padding:14px 16px calc(env(safe-area-inset-bottom) + 14px);box-shadow:0 -4px 16px #0009}
body.nomap #sheet{position:static;max-height:none;border-radius:0;box-shadow:none;padding-top:0}
body.nomap #top{position:static}
body.nomap #spacer{display:block}
#spacer{display:none;height:12px}
.status{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:10px}
.dot{width:8px;height:8px;border-radius:4px;background:#666}.dot.on{background:#2fb36b}
.title{font-size:20px;font-weight:600;margin:2px 0}
.sub{font-size:14px;color:var(--muted);margin-bottom:8px}
.eta{font-size:16px;margin:8px 0}
.eta b{font-size:22px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button.main{flex:1;font-size:17px;padding:13px;border-radius:12px;border:0;background:var(--accent);color:#fff;font-weight:600}
button.sec{font-size:15px;padding:13px 14px;border-radius:12px;border:0;background:#2a3a45;color:var(--text)}
.item{display:flex;gap:10px;align-items:flex-start;padding:11px 2px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.num{flex:none;width:22px;height:22px;border-radius:11px;background:var(--blue);color:#fff;font-size:13px;text-align:center;line-height:22px;margin-top:1px}
.item .n{font-size:16px}.item .a{font-size:13px;color:var(--muted)}
h3{font-size:13px;color:var(--muted);font-weight:500;margin:14px 0 2px;letter-spacing:.5px}
.msg{color:var(--warn);font-size:14px;margin:6px 0}
.legend{font-size:12px;color:var(--muted)}
.fab.on{color:#2fb36b}
.fab{position:fixed;right:12px;z-index:4;width:44px;height:44px;border-radius:22px;border:0;background:var(--card);color:var(--text);
  font-size:20px;box-shadow:0 2px 10px #0008;display:flex;align-items:center;justify-content:center}
body.nomap .fab{display:none}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:40%;z-index:6;background:#000c;color:#fff;font-size:14px;padding:8px 14px;border-radius:10px;display:none}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;margin:0 3px 2px 8px;vertical-align:middle}
</style></head><body>
<div id="mapwrap"><div id="map"></div></div>
<div id="top">
  <form id="f"><input id="q" placeholder="搜地点，或粘贴百度地图分享" autocomplete="off" enterkeyhint="search"></form>
  <div id="chips"></div>
</div>
<button class="fab" id="fabme" onclick="toMe()" aria-label="我的位置"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
<button class="fab" id="fabcar" onclick="toCar()" aria-label="车的位置"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16V11l2-5h10l2 5v5"/><path d="M3 16h18v2H3z"/><path d="M5 11h14"/><circle cx="8" cy="14" r="0.6" fill="currentColor"/><circle cx="16" cy="14" r="0.6" fill="currentColor"/><path d="M6 18v2M18 18v2"/></svg></button>
<button class="fab" id="fabtraffic" onclick="showTraffic(!traffic)" aria-label="全城路况"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="20" rx="3"/><circle cx="12" cy="7" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="17" r="1.5"/></svg></button>
<div id="toast"></div>
<div id="spacer"></div>
<div id="sheet"><div id="body">读取中…</div></div>
<script>
const $=id=>document.getElementById(id);
const JSAK='__BAIDU_JS_AK__';   // the browser AK, filled in by navrelay; without one there is no map
const PI=Math.PI,A=6378245.0,EE=0.00669342162296594323,XPI=PI*3000/180;
function gcjDelta(lat,lon){const x=lon-105,y=lat-35;
  let dlat=-100+2*x+3*y+0.2*y*y+0.1*x*y+0.2*Math.sqrt(Math.abs(x));
  dlat+=(20*Math.sin(6*x*PI)+20*Math.sin(2*x*PI))*2/3;dlat+=(20*Math.sin(y*PI)+40*Math.sin(y/3*PI))*2/3;
  dlat+=(160*Math.sin(y/12*PI)+320*Math.sin(y*PI/30))*2/3;
  let dlon=300+x+2*y+0.1*x*x+0.1*x*y+0.1*Math.sqrt(Math.abs(x));
  dlon+=(20*Math.sin(6*x*PI)+20*Math.sin(2*x*PI))*2/3;dlon+=(20*Math.sin(x*PI)+40*Math.sin(x/3*PI))*2/3;
  dlon+=(150*Math.sin(x/12*PI)+300*Math.sin(x/30*PI))*2/3;
  const rad=lat/180*PI,magic=1-EE*Math.sin(rad)**2;
  return [dlat*180/((A*(1-EE))/(magic*Math.sqrt(magic))*PI),dlon*180/(A/Math.sqrt(magic)*Math.cos(rad)*PI)]}
function bdPoint(lat,lon){   // WGS-84 -> GCJ-02 -> BD-09, the map's
  const d=gcjDelta(lat,lon),x=lon+d[1],y=lat+d[0];
  const z=Math.sqrt(x*x+y*y)+0.00002*Math.sin(y*XPI),t=Math.atan2(y,x)+0.000003*Math.cos(x*XPI);
  return new BMapGL.Point(z*Math.cos(t)+0.0065,z*Math.sin(t)+0.006)}
function wgsOf(p){   // BD-09 -> GCJ-02 -> WGS-84
  const x=p.lng-0.0065,y=p.lat-0.006,z=Math.sqrt(x*x+y*y)-0.00002*Math.sin(y*XPI),t=Math.atan2(y,x)-0.000003*Math.cos(x*XPI);
  const glat=z*Math.sin(t),glon=z*Math.cos(t);let lat=glat,lon=glon;
  for(let i=0;i<4;i++){const d=gcjDelta(lat,lon);lat-=lat+d[0]-glat;lon-=lon+d[1]-glon}
  return [lat,lon]}
const COLORS={1:'#2fb36b',2:'#f2c94c',3:'#eb5757',4:'#9b1c1c'};
const ME_ICON='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18">'
  +'<circle cx="9" cy="9" r="7" fill="#2d7ff9" stroke="#fff" stroke-width="2.5"/></svg>');   // the phone
const ICONS={   // single-colour line icons for the saved places
  home:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>',
  work:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V4h6v3"/><path d="M3 13h18"/></svg>',
  star:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg>'};
function carIcon(bearing){
  const glyph=bearing==null?'<path d="M8 17v-4l1.6-3.5h6.8L18 13v4zM8 17v1.5M18 17v1.5M8 13h10" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/>'
    :'<path d="M13 5l5.5 13-5.5-3-5.5 3z" fill="#fff" transform="rotate('+Math.round(bearing)+' 13 13)"/>';
  return 'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26">'
    +'<circle cx="13" cy="13" r="11.5" fill="#2fb36b" stroke="#fff" stroke-width="2"/>'+glyph+'</svg>')}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function km(m){return m>=1000?(m/1000).toFixed(m>=100000?0:1)+' 公里':Math.round(m)+' 米'}
function mins(s){return s>=3600?Math.floor(s/3600)+' 小时 '+Math.round(s%3600/60)+' 分':Math.max(1,Math.round(s/60))+' 分钟'}
function ago(t){const m=Math.round((Date.now()/1000-t)/60);return m<1?'刚刚':m<60?m+' 分钟前':Math.round(m/60)+' 小时前'}
function nameOf(p){return p.name||p.place_name||(p.latitude.toFixed(5)+', '+p.longitude.toFixed(5))}
async function api(path,body,headers){   // the phone's position goes in headers or bodies, never a URL: access logs keep URLs
  const r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{headers:headers||{}});
  if(r.status===403){location.reload();throw new Error('key')}
  return r.json()}

// view: 'home' (the car and its destination), 'results' (a search), 'place' (one place, its preview, send it)
let state=null,places={saved:{},recent:[]},route=null,view='home',results=[],picked=null,preview=null,msg='';
let map=null,layer=[],marks=[],fitKey='',phone=null;   // phone: [lat, lon], the start when the car's position is not known
function locate(){if(!navigator.geolocation)return;navigator.geolocation.watchPosition(p=>{const first=!phone;phone=[p.coords.latitude,p.coords.longitude];if(first)draw()},()=>{},
  {enableHighAccuracy:false,maximumAge:120000,timeout:20000})}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>{e.style.display='none'},2000)}
function focus(at){   // centred in the map left between the search bar and the sheet, not in the screen
  if(!map)return;map.centerAndZoom(bdPoint(at[0],at[1]),Math.max(map.getZoom(),16));
  const top=$('top').offsetHeight,bottom=$('sheet').offsetHeight,dy=Math.round((top-bottom)/2);
  if(dy)map.panBy(0,dy,{noAnimation:true})}
function carAt(){return (route&&route.car)||(state&&state.position)}
function toMe(){
  if(phone)return focus(phone);
  if(!navigator.geolocation)return toast('浏览器不给定位');
  toast('定位中…');
  navigator.geolocation.getCurrentPosition(p=>{phone=[p.coords.latitude,p.coords.longitude];draw();focus(phone)},
    ()=>toast('拿不到手机位置，看看是否允许了定位'),{enableHighAccuracy:true,maximumAge:30000,timeout:15000})}
function toCar(){const c=carAt();if(c)focus(c);else toast(state&&state.car_online===false?'车不在线，不知道车在哪':'还不知道车的位置')}
function placeFabs(){const b=$('sheet').offsetHeight+12;$('fabcar').style.bottom=b+'px';$('fabme').style.bottom=(b+52)+'px';$('fabtraffic').style.bottom=(b+104)+'px'}
let traffic=true;   // the city's traffic layer
try{traffic=localStorage.getItem('traffic')!=='0'}catch(e){}
function showTraffic(on){traffic=on;$('fabtraffic').classList.toggle('on',on);try{localStorage.setItem('traffic',on?'1':'0')}catch(e){}
  if(!map)return;try{on?map.setTrafficOn():map.setTrafficOff()}catch(e){}}
addEventListener('resize',placeFabs)

function statusLine(){
  if(!state)return'';
  const on=state.car_online!==false;
  let t=on?(state.onroad?'车已启动':'车已连上，没启动'):'车不在线'+(state.last_seen?'，最后在线 '+ago(state.last_seen):'');
  return '<div class="status"><span class="dot'+(on?' on':'')+'"></span>'+esc(t)+'</div>'}
function etaLine(r){
  if(!r||!r.route)return r&&r.error?'<div class="msg">'+esc(r.error)+'</div>':'';
  const ro=r.route,head=ro.source==='nav'?'剩余 ':'';
  let h='<div class="eta">'+(ro.duration!=null?'<b>'+mins(ro.duration)+'</b> · ':'')+(ro.distance!=null?head+km(ro.distance):'')+'</div>';
  if(ro.source==='preview'&&ro.from==='phone')h+='<div class="sub">从手机所在位置算的</div>';
  if(ro.source==='preview'&&ro.age>90)h+='<div class="sub">'+Math.round(ro.age/60)+' 分钟前的路况</div>';
  if(r.offline)h+='<div class="sub">车离线前的最后一条路线</div>';
  return h+'<div class="legend">路况<i style="background:#2fb36b"></i>畅通<i style="background:#f2c94c"></i>缓行<i style="background:#eb5757"></i>拥堵</div>'}
function list(items,act){return items.map((p,i)=>'<div class="item" onclick="'+act+'('+i+')">'+(act==='pickResult'?'<span class="num">'+(i+1)+'</span>':'')
  +'<div><div class="n">'+esc(nameOf(p))+'</div><div class="a">'+esc(p.address||'')+'</div></div></div>').join('')}

function render(){
  $('chips').innerHTML=Object.keys(places.saved).map(k=>'<button class="chip" data-k="'+esc(k)+'" onclick="pickSaved(this.dataset.k)">'
    +(k==='家'?ICONS.home:k==='公司'?ICONS.work:ICONS.star)+esc(k)+'</button>').join('');
  let h='';
  if(view==='results'){
    h='<div class="row" style="margin:0 0 6px"><button class="sec" onclick="home()">返回</button></div>'
      +(msg?'<div class="msg">'+esc(msg)+'</div>':'')+(results.length?list(results,'pickResult'):(msg?'':'<div class="sub">没找到</div>'));
  }else if(view==='place'){
    const p=picked,saved=Object.keys(places.saved).find(k=>same(places.saved[k],p));
    h='<div class="title">'+esc(nameOf(p))+'</div><div class="sub">'+esc(p.address||'')+(saved?' · 常用地点：'+esc(saved):'')+'</div>'
      +(preview?etaLine(preview):'<div class="sub">路线预览中…</div>')+(msg?'<div class="msg">'+esc(msg)+'</div>':'')
      +'<div class="row"><button class="main" onclick="send()">'+(state&&state.car_online===false?'发到车上（车上线后自动导航）':'发到车上')+'</button></div>'
      +'<div class="row"><button class="sec" onclick="home()">返回</button>'+(saved?'':'<button class="sec" onclick="savePicked()">存为常用地点</button>')+'</div>';
  }else{
    h=statusLine();
    const d=state&&state.destination;
    if(!state)h+='读取中…';
    else if(!state.navigation)h+='<div class="msg">车上没开导航：设置 &gt; 开发者 &gt; navigation (alpha)</div>';
    if(d){
      h+='<div class="sub">'+(state.queued?'等车上线后发送':(route&&route.route&&route.route.source==='nav'?'导航中':'目的地'))+'</div>'
        +'<div class="title">'+esc(nameOf(d))+'</div>'+(d.place_address?'<div class="sub">'+esc(d.place_address)+'</div>':'')
        +etaLine(route)+(msg?'<div class="msg">'+esc(msg)+'</div>':'')
        +'<div class="row"><button class="sec" onclick="clearDest()">取消导航</button>'
        +(state.saved_as?'':'<button class="sec" onclick="saveCur()">存为常用地点</button>')+'</div>';
    }else if(state){h+='<div class="sub">还没有目的地。搜一个地点，或者在地图上点一下。</div>'+(msg?'<div class="msg">'+esc(msg)+'</div>':'')}
    if(places.recent.length)h+='<h3>最近去过</h3>'+list(places.recent,'pickRecent');
  }
  $('body').innerHTML=h;
  placeFabs();
  draw();
}
function same(a,b){return a&&b&&Math.abs(a.latitude-b.latitude)<1e-4&&Math.abs(a.longitude-b.longitude)<1e-4}

// the map
function mapReady(){
  document.body.classList.remove('nomap');
  map=new BMapGL.Map('map');map.centerAndZoom(new BMapGL.Point(118.7969,32.0603),12);map.enableScrollWheelZoom(true);
  showTraffic(traffic)
  map.addEventListener('click',e=>{if(e.overlay)return;const w=wgsOf(e.latlng);pick({name:'地图上选的点',address:'',latitude:w[0],longitude:w[1]})});
  fitKey='';draw()}
function draw(){
  if(!map)return;
  layer.forEach(o=>map.removeOverlay(o));layer=[];
  const all=[],add=o=>{map.addOverlay(o);layer.push(o)};
  const r=view==='place'?preview:(view==='home'?route:null);
  if(r&&r.route)for(const seg of r.route.segments){const pts=seg.points.map(p=>bdPoint(p[0],p[1]));all.push(...pts);
    add(new BMapGL.Polyline(pts,{strokeColor:COLORS[seg.status]||COLORS[1],strokeWeight:7,strokeOpacity:0.95}))}
  const car=carAt();
  if(phone)add(new BMapGL.Marker(bdPoint(phone[0],phone[1]),{icon:new BMapGL.Icon(ME_ICON,new BMapGL.Size(18,18))}));
  if(car){const c=bdPoint(car[0],car[1]);add(new BMapGL.Marker(c,{icon:new BMapGL.Icon(carIcon(car[2]),new BMapGL.Size(26,26))}));if(view!=='results')all.push(c)}
  const target=view==='place'?picked:(view==='home'&&state?state.destination:null);
  if(target){const p=bdPoint(target.latitude,target.longitude);add(new BMapGL.Marker(p));all.push(p)}
  if(view==='results')results.forEach((p,i)=>{const pt=bdPoint(p.latitude,p.longitude);const m=new BMapGL.Marker(pt);
    m.addEventListener('click',()=>pickResult(i));add(m);all.push(pt);
    const l=new BMapGL.Label(String(i+1),{position:pt,offset:new BMapGL.Size(-4,-34)});
    l.setStyle({border:'0',background:'transparent',color:'#fff',fontWeight:'bold'});add(l)});
  const key=view+'|'+(target?target.latitude+','+target.longitude:'')+'|'+(r&&r.route?r.route.source:'')+'|'+results.length;
  if(all.length&&key!==fitKey){const sheet=$('sheet').offsetHeight,top=$('top').offsetHeight;
    map.setViewport(all,{margins:[top+20,30,sheet+20,30]});fitKey=key}}
if(!JSAK.startsWith('__')){const sc=document.createElement('script');
  sc.src='https://api.map.baidu.com/api?type=webgl&v=1.0&ak='+encodeURIComponent(JSAK)+'&callback=mapReady';document.head.appendChild(sc)}
else document.body.classList.add('nomap');

// actions
function home(){view='home';picked=null;preview=null;msg='';render();loadRoute()}
async function pick(p){view='place';picked=p;preview=null;msg='';render();
  if(!phone&&!(state&&state.position))await new Promise(r=>setTimeout(r,1500));   // the first fix
  try{preview=await api('/api/preview',Object.assign({},p,phone?{origin:phone}:{}))}catch(e){preview={route:null,error:'预览失败'}}if(picked===p)render()}
function pickResult(i){pick(results[i])}
function pickRecent(i){pick(places.recent[i])}
function pickSaved(k){pick(places.saved[k])}
async function send(){const r=await api('/api/destination',picked);if(r.error){msg=r.error;render();return}
  state=r;route=preview;view='home';picked=null;preview=null;msg=r.queued?'车不在线，上线后会自动开始导航':'';loadPlaces();render();loadRoute()}
async function clearDest(){state=await api('/api/clear',{});route=null;msg='';render()}
async function saveCur(){const k=prompt('起个名字，比如 家、公司');if(!k)return;const r=await api('/api/places',{label:k});
  if(r.error){msg=r.error;render();return}places=r;refresh()}
async function savePicked(){const k=prompt('起个名字，比如 家、公司');if(!k)return;const r=await api('/api/places',{label:k,place:picked});
  if(r.error){msg=r.error;render();return}places=r;render()}
$('f').onsubmit=async e=>{e.preventDefault();$('q').blur();const q=$('q').value.trim();if(!q)return;
  view='results';results=[];msg='搜索中…';render();
  const r=await api('/api/search',phone?{query:q,origin:phone}:{query:q});msg=r.error||'';results=r.places||[];
  if(results.length===1&&/https?:\/\//.test(q))return pick(results[0]);   // a pasted share: straight to it
  render()};
async function refresh(){try{state=await api('/api/state')}catch(e){return}if(view==='home')render()}
async function loadPlaces(){try{places=await api('/api/places')}catch(e){}}
async function loadRoute(){if(view!=='home')return;try{route=await api('/api/route',null,phone?{'X-From':phone.join(',')}:null)}catch(e){return}
  if(view==='home')render()}
locate();
(async()=>{await Promise.all([refresh(),loadPlaces()]);render();loadRoute()})();
setInterval(()=>{if(document.visibilityState==='visible')refresh()},5000);
setInterval(()=>{if(document.visibilityState==='visible')loadRoute()},15000);
</script></body></html>
